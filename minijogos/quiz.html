<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quiz de Matemática</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --card-bg: #16162a;
      --accent: #38bdf8;
      --text: #f0f0f8;
      --muted: #8888aa;
      --green: #4ecdc4;
      --red: #ff4757;
      --yellow: #f7c948;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    nav { width: 100%; max-width: 560px; margin-bottom: 1.5rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; transition: color 0.2s; }
    nav a:hover { color: var(--accent); }

    h1 { font-family: 'Bangers', cursive; font-size: 2.8rem; color: var(--accent); letter-spacing: 3px; margin-bottom: 1rem; }

    .game-box {
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--accent);
      padding: 2rem 1.75rem;
      max-width: 560px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    /* Top bar: score + timer */
    .top-bar { display: flex; width: 100%; justify-content: space-between; align-items: center; }
    .score-disp { font-family: 'Bangers', cursive; font-size: 1.6rem; color: var(--yellow); letter-spacing: 1px; }
    .score-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; display: block; line-height: 1; }

    /* Timer bar */
    .timer-wrap { width: 100%; }
    .timer-bar-bg { width: 100%; height: 8px; background: #1e1e38; border-radius: 50px; overflow: hidden; }
    .timer-bar { height: 100%; background: var(--accent); border-radius: 50px; transition: width 0.1s linear, background 0.3s; }

    /* Progress */
    .progress { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 1px; }

    /* Question */
    .question {
      font-family: 'Bangers', cursive;
      font-size: 3.5rem;
      color: var(--text);
      letter-spacing: 3px;
      text-align: center;
      line-height: 1.1;
    }

    /* Options */
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .opt-btn {
      padding: 0.85rem;
      border-radius: 12px;
      border: 2px solid #333355;
      background: #1e1e38;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: center;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #242440; transform: scale(1.03); }
    .opt-btn:disabled { cursor: default; transform: none; }
    .opt-btn.correct { border-color: var(--green); background: rgba(78,205,196,0.15); color: var(--green); }
    .opt-btn.wrong { border-color: var(--red); background: rgba(255,71,87,0.15); color: var(--red); }
    .opt-btn.reveal { border-color: var(--green); background: rgba(78,205,196,0.1); color: var(--green); }

    /* Feedback */
    .feedback {
      font-family: 'Bangers', cursive;
      font-size: 1.8rem;
      letter-spacing: 2px;
      min-height: 2.2rem;
      text-align: center;
    }
    .feedback.ok { color: var(--green); }
    .feedback.no { color: var(--red); }

    /* Result screen */
    .result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }
    .result-screen.show { display: flex; }

    .final-score {
      font-family: 'Bangers', cursive;
      font-size: 5rem;
      color: var(--yellow);
      line-height: 1;
    }
    .final-label { color: var(--muted); font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; }
    .final-detail { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .final-detail span { color: var(--text); font-weight: 800; }

    .stars { font-size: 2.5rem; letter-spacing: 8px; }

    /* Diff */
    .diff-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .diff-btn {
      padding: 5px 14px;
      border-radius: 50px;
      border: 1.5px solid #333355;
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .diff-btn:hover, .diff-btn.active { border-color: var(--accent); color: var(--text); background: rgba(56,189,248,0.1); }

    .btn {
      padding: 0.65rem 2rem;
      border-radius: 50px;
      border: none;
      background: var(--accent);
      color: #001a2a;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover { filter: brightness(1.1); transform: scale(1.04); }

    .play-area { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; width: 100%; }
    .start-screen { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; width: 100%; }
    .start-desc { color: var(--muted); font-size: 0.9rem; font-weight: 600; text-align: center; line-height: 1.6; }
  </style>
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="pwa.js" defer></script>
</head>
<body>
  <nav><a href="index.html">← Voltar ao Menu</a></nav>
  <h1>Quiz de Matemática</h1>

  <div class="game-box">

    <!-- Start screen -->
    <div class="start-screen" id="start-screen">
      <p class="start-desc">Responda 10 perguntas contrarrelógio.<br>Quanto mais rápido, mais pontos por questão.</p>
      <div>
        <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600;text-align:center;margin-bottom:8px;">Dificuldade</div>
        <div class="diff-buttons">
          <button class="diff-btn active" onclick="setDiff('easy', this)">Fácil</button>
          <button class="diff-btn" onclick="setDiff('medium', this)">Normal</button>
          <button class="diff-btn" onclick="setDiff('hard', this)">Difícil</button>
        </div>
      </div>
      <button class="btn" onclick="startGame()">Começar</button>
    </div>

    <!-- Play area -->
    <div class="play-area" id="play-area" style="display:none">
      <div class="top-bar">
        <div>
          <span class="score-label">Pontos</span>
          <span class="score-disp" id="score-disp">0</span>
        </div>
        <div style="text-align:right">
          <span class="score-label">Questão</span>
          <span class="score-disp" id="q-num">1 / 10</span>
        </div>
      </div>

      <div class="timer-wrap">
        <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
      </div>

      <div class="question" id="question">?</div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>
    </div>

    <!-- Result screen -->
    <div class="result-screen" id="result-screen">
      <div class="final-score" id="final-score">0</div>
      <div class="final-label">Pontuação Final</div>
      <div class="stars" id="stars"></div>
      <div class="final-detail">Acertos: <span id="final-hits">0</span> de 10</div>
      <div class="final-detail">Melhor: <span id="best-score">0</span></div>
      <button class="btn" onclick="restartGame()">Jogar Novamente</button>
    </div>

  </div>

<script>
let diff = 'easy';
let currentQ = 0, score = 0, hits = 0, timerInt, timeLeft, bestScore = 0;
const TOTAL = 10;
const TIME = 12; // seconds per question

function setDiff(d, btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  diff = d;
}

function genQuestion() {
  const ops = diff === 'easy'
    ? ['+', '-', '*', '*', '*', '/', '/']
    : diff === 'medium'
    ? ['+', '-', '*', '*', '*', '*', '/', '/', '/']
    : ['+', '-', '*', '*', '*', '*', '*', '/', '/', '/', '/'];

  const op = ops[Math.floor(Math.random() * ops.length)];

  let a, b, answer, text;

  if (op === '+') {
    a = rand(diff);
    b = rand(diff);
    answer = a + b;
    text = `${a} + ${b}`;
  }

  else if (op === '-') {
    a = rand(diff);
    b = rand(diff);
    if (b > a) [a, b] = [b, a];
    answer = a - b;
    text = `${a} − ${b}`;
  }

  else if (op === '*') {
    if (diff === 'easy') {
      a = Math.floor(Math.random() * 10) + 2;
      b = Math.floor(Math.random() * 10) + 2;
    } else if (diff === 'medium') {
      a = Math.floor(Math.random() * 15) + 2;
      b = Math.floor(Math.random() * 15) + 2;
    } else {
      a = Math.floor(Math.random() * 25) + 2;
      b = Math.floor(Math.random() * 25) + 2;
    }

    answer = a * b;
    text = `${a} × ${b}`;
  }

  else {
    if (diff === 'easy') {
      b = Math.floor(Math.random() * 9) + 2;
      answer = Math.floor(Math.random() * 20) + 1;
    } else if (diff === 'medium') {
      b = Math.floor(Math.random() * 15) + 2;
      answer = Math.floor(Math.random() * 40) + 1;
    } else {
      b = Math.floor(Math.random() * 20) + 2;
      answer = Math.floor(Math.random() * 80) + 1;
    }

    a = answer * b;
    text = `${a} ÷ ${b}`;
  }

  const wrongSet = new Set();

  while (wrongSet.size < 3) {
    let erro = answer + (Math.floor(Math.random() * 20) - 10);

    if (erro !== answer && erro >= 0) {
      wrongSet.add(erro);
    }
  }

  const options = shuffle([answer, ...wrongSet]);

  return {
    text,
    answer,
    options
  };
}

function rand(d) {
  if (d === 'easy') return Math.floor(Math.random() * 20) + 1;
  if (d === 'medium') return Math.floor(Math.random() * 50) + 1;
  return Math.floor(Math.random() * 100) + 1;
}

function randMul(d) {
  if (d === 'easy') return Math.floor(Math.random() * 9) + 2;
  if (d === 'medium') return Math.floor(Math.random() * 12) + 2;
  return Math.floor(Math.random() * 15) + 2;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let currentQuestion = null;

function startGame() {
  currentQ = 0; score = 0; hits = 0;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('play-area').style.display = 'flex';
  nextQuestion();
}

function nextQuestion() {
  if (currentQ >= TOTAL) { endGame(); return; }
  currentQ++;
  document.getElementById('q-num').textContent = `${currentQ} / ${TOTAL}`;
  document.getElementById('score-disp').textContent = score;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  currentQuestion = genQuestion();
  document.getElementById('question').textContent = currentQuestion.text + ' = ?';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  currentQuestion.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => answer(opt, btn));
    opts.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInt);
  timeLeft = TIME;
  updateTimerBar();
  timerInt = setInterval(() => {
    timeLeft -= 0.1;
    updateTimerBar();
    if (timeLeft <= 0) {
      clearInterval(timerInt);
      timeUp();
    }
  }, 100);
}

function updateTimerBar() {
  const pct = Math.max(0, (timeLeft / TIME) * 100);
  const bar = document.getElementById('timer-bar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'var(--accent)' : pct > 25 ? 'var(--yellow)' : 'var(--red)';
}

function answer(val, btn) {
  clearInterval(timerInt);
  disableOptions();

  const correct = val === currentQuestion.answer;
  if (correct) {
    btn.classList.add('correct');
    hits++;
    const bonus = Math.ceil(timeLeft / TIME * 100);
    score += bonus;
    document.getElementById('feedback').textContent = `+${bonus} pts`;
    document.getElementById('feedback').className = 'feedback ok';
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').textContent = 'Errou!';
    document.getElementById('feedback').className = 'feedback no';
    // Reveal correct
    document.querySelectorAll('.opt-btn').forEach(b => {
      if (parseInt(b.textContent) === currentQuestion.answer || b.textContent == currentQuestion.answer) {
        b.classList.add('reveal');
      }
    });
  }

  setTimeout(nextQuestion, 1200);
}

function timeUp() {
  disableOptions();
  document.getElementById('feedback').textContent = 'Tempo esgotado!';
  document.getElementById('feedback').className = 'feedback no';
  document.querySelectorAll('.opt-btn').forEach(b => {
    if (b.textContent == currentQuestion.answer) b.classList.add('reveal');
  });
  setTimeout(nextQuestion, 1200);
}

function disableOptions() {
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
}

function endGame() {
  clearInterval(timerInt);
  document.getElementById('play-area').style.display = 'none';
  document.getElementById('result-screen').classList.add('show');

  if (score > bestScore) bestScore = score;

  document.getElementById('final-score').textContent = score;
  document.getElementById('final-hits').textContent = hits;
  document.getElementById('best-score').textContent = bestScore;

  const ratio = hits / TOTAL;
  let starsStr = ratio >= 0.9 ? '★★★' : ratio >= 0.6 ? '★★☆' : '★☆☆';
  document.getElementById('stars').textContent = starsStr;
}

function restartGame() {
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('start-screen').style.display = 'flex';
}
</script>
</body>
</html>
