<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pedra Papel Tesoura</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --card-bg: #16162a;
      --accent: #f7c948;
      --text: #f0f0f8;
      --muted: #8888aa;
      --green: #4ecdc4;
      --red: #ff4757;
      --draw: #a855f7;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Campo estrelado animado */
    .stars-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 4s infinite;
    }

    .star.small {
      width: 1px;
      height: 1px;
      animation-duration: 2s;
    }

    .star.medium {
      width: 2px;
      height: 2px;
      animation-duration: 3s;
    }

    .star.large {
      width: 3px;
      height: 3px;
      animation-duration: 4s;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Tela de carregamento */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid var(--muted);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    nav a:hover { 
      color: var(--accent);
      transform: translateX(5px);
    }
    
    nav a:hover::before {
      width: 100%;
    }

    nav { 
      width: 100%; 
      max-width: 640px; 
      margin-bottom: 1.5rem;
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 0.25rem;
      animation: slideDown 0.8s ease-out 0.2s both;
      text-shadow: 0 0 20px rgba(247,201,72,0.5);
    }

    .score-board {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      align-items: center;
      animation: slideDown 0.8s ease-out 0.4s both;
    }

    .score-box {
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .score-box:hover {
      transform: translateY(-5px);
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .score-num {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      line-height: 1;
      transition: all 0.3s ease;
      position: relative;
    }

    .score-num.player { 
      color: var(--green);
      text-shadow: 0 0 20px rgba(78,205,196,0.5);
    }
    
    .score-num.cpu { 
      color: var(--red);
      text-shadow: 0 0 20px rgba(255,71,87,0.5);
    }
    
    .score-num.draws { 
      color: var(--draw);
      text-shadow: 0 0 20px rgba(168,85,247,0.5);
    }

    .score-number {
      display: inline-block;
      animation: scorePop 0.5s ease-out;
    }

    @keyframes scorePop {
      0% { transform: scale(0) rotate(180deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .vs-badge {
      font-family: 'Bangers', cursive;
      font-size: 1.5rem;
      color: var(--muted);
      letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .arena {
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--accent);
      padding: 2rem;
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .showdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      width: 100%;
    }

    .fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .fighter-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .fighter-emoji {
      font-size: 5rem;
      line-height: 1;
      min-width: 90px;
      text-align: center;
      transition: transform 0.3s;
    }

    .fighter-emoji.shake {
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-8px) rotate(-10deg); }
      75% { transform: translateX(8px) rotate(10deg); }
    }

    .vs-center {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--muted);
    }

    .result-banner {
      font-family: 'Bangers', cursive;
      font-size: 2.5rem;
      letter-spacing: 3px;
      min-height: 3rem;
      text-align: center;
      transition: all 0.3s;
    }
    .result-banner.win { color: var(--green); }
    .result-banner.lose { color: var(--red); }
    .result-banner.draw { color: var(--draw); }

    .choices {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 2px solid #333355;
      background: #1e1e38;
      color: var(--text);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
    }

    .choice-btn:hover {
      border-color: var(--accent);
      background: #2a2a44;
      transform: translateY(-4px) scale(1.05);
    }

    .choice-btn:active { transform: scale(0.97); }

    .choice-btn .choice-icon { font-size: 2.5rem; }

    .reset-btn {
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      border: 2px solid #333355;
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .history {
      width: 100%;
      max-width: 640px;
      margin-top: 1.5rem;
    }

    .history-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-row {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      gap: 0.5rem;
    }

    .history-row .result-tag {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 50px;
    }
    .win-tag { background: var(--green); color: #001a1a; }
    .lose-tag { background: var(--red); color: #fff; }
    .draw-tag { background: var(--draw); color: #fff; }
  </style>
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="pwa.js" defer></script>
</head>
<body>
  <nav><a href="index.html">← Voltar ao Menu</a></nav>
  <h1>✂️ Pedra Papel Tesoura</h1>

  <div class="score-board">
    <div class="score-box">
      <div class="score-label">Você</div>
      <div class="score-num player" id="score-player">0</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="score-box">
      <div class="score-label">CPU</div>
      <div class="score-num cpu" id="score-cpu">0</div>
    </div>
    <div class="vs-badge">·</div>
    <div class="score-box">
      <div class="score-label">Empates</div>
      <div class="score-num draws" id="score-draws">0</div>
    </div>
  </div>

  <div class="arena">
    <div class="showdown">
      <div class="fighter">
        <div class="fighter-label">Você</div>
        <div class="fighter-emoji" id="player-choice">🤔</div>
      </div>
      <div class="vs-center">VS</div>
      <div class="fighter">
        <div class="fighter-label">CPU</div>
        <div class="fighter-emoji" id="cpu-choice">🤖</div>
      </div>
    </div>

    <div class="result-banner" id="result-banner">Faça sua escolha!</div>

    <div class="choices">
      <button class="choice-btn" onclick="play('pedra')">
        <span class="choice-icon">🪨</span>
        Pedra
      </button>
      <button class="choice-btn" onclick="play('papel')">
        <span class="choice-icon">📄</span>
        Papel
      </button>
      <button class="choice-btn" onclick="play('tesoura')">
        <span class="choice-icon">✂️</span>
        Tesoura
      </button>
    </div>

    <button class="reset-btn" onclick="reset()">Reiniciar Placar</button>
  </div>

  <div class="history">
    <div class="history-title">Histórico</div>
    <div class="history-list" id="history-list"></div>
  </div>

<script>
const emojis = { pedra: '🪨', papel: '📄', tesoura: '✂️' };
const options = ['pedra', 'papel', 'tesoura'];
const beats = { pedra: 'tesoura', papel: 'pedra', tesoura: 'papel' };

let scores = { player: 0, cpu: 0, draws: 0 };
let historyItems = [];

function play(playerChoice) {
  const cpuChoice = options[Math.floor(Math.random() * 3)];

  const pe = document.getElementById('player-choice');
  const ce = document.getElementById('cpu-choice');

  pe.textContent = '❓';
  ce.textContent = '❓';
  pe.classList.add('shake');
  ce.classList.add('shake');

  setTimeout(() => {
    pe.classList.remove('shake');
    ce.classList.remove('shake');
    pe.textContent = emojis[playerChoice];
    ce.textContent = emojis[cpuChoice];

    let result, label, cls;
    if (playerChoice === cpuChoice) {
      result = '🤝 Empate!';
      label = 'Empate';
      cls = 'draw';
      scores.draws++;
    } else if (beats[playerChoice] === cpuChoice) {
      result = '🎉 Você Ganhou!';
      label = 'Vitória';
      cls = 'win';
      scores.player++;
    } else {
      result = '💀 CPU Ganhou!';
      label = 'Derrota';
      cls = 'lose';
      scores.cpu++;
    }

    const banner = document.getElementById('result-banner');
    banner.textContent = result;
    banner.className = 'result-banner ' + cls;

    document.getElementById('score-player').textContent = scores.player;
    document.getElementById('score-cpu').textContent = scores.cpu;
    document.getElementById('score-draws').textContent = scores.draws;

    addHistory(emojis[playerChoice], emojis[cpuChoice], label, cls);
  }, 500);
}

function addHistory(pe, ce, label, cls) {
  historyItems.unshift({ pe, ce, label, cls });
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  historyItems.slice(0, 10).forEach(item => {
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <span>${item.pe} vs ${item.ce}</span>
      <span class="result-tag ${item.cls}-tag">${item.label}</span>
    `;
    list.appendChild(row);
  });
}

function reset() {
  scores = { player: 0, cpu: 0, draws: 0 };
  historyItems = [];
  document.getElementById('score-player').textContent = '0';
  document.getElementById('score-cpu').textContent = '0';
  document.getElementById('score-draws').textContent = '0';
  document.getElementById('player-choice').textContent = '🤔';
  document.getElementById('cpu-choice').textContent = '🤖';
  document.getElementById('result-banner').textContent = 'Faça sua escolha!';
  document.getElementById('result-banner').className = 'result-banner';
  document.getElementById('history-list').innerHTML = '';
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '1') play('pedra');
  if (e.key === '2') play('papel');
  if (e.key === '3') play('tesoura');
});
</script>
</body>
</html>
