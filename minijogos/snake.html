<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --card-bg: #16162a;
      --accent: #fb7185;
      --text: #f0f0f8;
      --muted: #8888aa;
      --green: #4ecdc4;
      --snake: #fb7185;
      --food: #f7c948;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    nav { width: 100%; max-width: 520px; margin-bottom: 1.5rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; transition: color 0.2s; }
    nav a:hover { color: var(--accent); }

    h1 { font-family: 'Bangers', cursive; font-size: 2.8rem; color: var(--accent); letter-spacing: 3px; margin-bottom: 0.8rem; }

    .top-bar {
      display: flex;
      width: 100%;
      max-width: 480px;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      align-items: center;
    }
    .stat { text-align: center; }
    .stat-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; display: block; }
    .stat-val { font-family: 'Bangers', cursive; font-size: 2rem; color: var(--text); line-height: 1; }
    .stat-val.accent { color: var(--accent); }

    .canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--accent);
    }

    canvas {
      display: block;
      background: #0a0a14;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,10,20,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .overlay.hidden { display: none; }

    .overlay-title {
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      color: var(--accent);
      letter-spacing: 3px;
    }
    .overlay-sub { color: var(--muted); font-weight: 600; font-size: 0.9rem; text-align: center; }

    /* Mobile controls */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 4px;
      margin-top: 1rem;
    }
    .dpad-btn {
      border-radius: 10px;
      border: 2px solid #333355;
      background: #1e1e38;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn:active { background: var(--accent); border-color: var(--accent); }
    .dpad-empty { background: transparent; border: none; pointer-events: none; }

    .diff-buttons { display: flex; gap: 8px; margin-top: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .diff-btn {
      padding: 5px 14px;
      border-radius: 50px;
      border: 1.5px solid #333355;
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .diff-btn:hover, .diff-btn.active { border-color: var(--accent); color: var(--text); background: rgba(251,113,133,0.1); }

    .btn {
      padding: 0.65rem 2rem;
      border-radius: 50px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover { filter: brightness(1.1); transform: scale(1.04); }

    .hint { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-top: 0.25rem; }
  </style>
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="pwa.js" defer></script>
</head>
<body>
  <nav><a href="index.html">← Voltar ao Menu</a></nav>
  <h1>Snake</h1>

  <div class="top-bar">
    <div class="stat">
      <span class="stat-label">Pontos</span>
      <span class="stat-val accent" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Recorde</span>
      <span class="stat-val" id="best">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Nível</span>
      <span class="stat-val" id="level">1</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title">Snake</div>
      <div class="overlay-sub" id="overlay-sub">Controle com as setas do teclado<br>ou os botões abaixo.</div>
      <div class="diff-buttons">
        <button class="diff-btn active" onclick="setSpeed(150, this)">Devagar</button>
        <button class="diff-btn" onclick="setSpeed(100, this)">Normal</button>
        <button class="diff-btn" onclick="setSpeed(65, this)">Rápido</button>
      </div>
      <button class="btn" id="start-btn" onclick="startGame()">Jogar</button>
    </div>
  </div>

  <div class="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="changeDir(0,-1)">▲</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="changeDir(-1,0)">◀</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="changeDir(1,0)">▶</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="changeDir(0,1)">▼</button>
    <div class="dpad-empty"></div>
  </div>

  <p class="hint">Setas do teclado ou WASD para jogar</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

let snake, dir, nextDir, food, score, best = 0, level, gameLoop, baseSpeed = 150, running = false;

const SNAKE_COLOR = '#fb7185';
const SNAKE_HEAD = '#ff3a5c';
const FOOD_COLOR = '#f7c948';
const GRID_COLOR = 'rgba(255,255,255,0.02)';

function setSpeed(ms, btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  baseSpeed = ms;
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0; level = 1;
  document.getElementById('score').textContent = '0';
  document.getElementById('level').textContent = '1';
  placeFood();
  clearInterval(gameLoop);
  running = true;
  gameLoop = setInterval(tick, baseSpeed);
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function changeDir(dx, dy) {
  // Prevent reverse
  if (dx !== 0 && dir.x !== 0) return;
  if (dy !== 0 && dir.y !== 0) return;
  nextDir = { x: dx, y: dy };
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    level = Math.floor(score / 50) + 1;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    placeFood();
    // Speed up every 50 points
    clearInterval(gameLoop);
    const speed = Math.max(40, baseSpeed - (level - 1) * 10);
    gameLoop = setInterval(tick, speed);
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
  }

  // Food
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = FOOD_COLOR;
  ctx.shadowColor = FOOD_COLOR;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(fx + CELL/2, fy + CELL/2, CELL/2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const sx = seg.x * CELL, sy = seg.y * CELL;
    ctx.fillStyle = i === 0 ? SNAKE_HEAD : SNAKE_COLOR;
    if (i === 0) { ctx.shadowColor = SNAKE_HEAD; ctx.shadowBlur = 10; }
    else ctx.shadowBlur = 0;
    roundRect(ctx, sx + 1, sy + 1, CELL - 2, CELL - 2, 4);
    ctx.shadowBlur = 0;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  if (score > best) { best = score; document.getElementById('best').textContent = best; }
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = 'Game Over';
  document.getElementById('overlay-sub').textContent = `Pontuação: ${score}`;
  document.getElementById('start-btn').textContent = 'Jogar Novamente';
}

// Keyboard
document.addEventListener('keydown', e => {
  if (['ArrowUp','w','W'].includes(e.key)) { e.preventDefault(); changeDir(0, -1); }
  if (['ArrowDown','s','S'].includes(e.key)) { e.preventDefault(); changeDir(0, 1); }
  if (['ArrowLeft','a','A'].includes(e.key)) { e.preventDefault(); changeDir(-1, 0); }
  if (['ArrowRight','d','D'].includes(e.key)) { e.preventDefault(); changeDir(1, 0); }
  if (e.key === ' ' && !running) startGame();
});

// Initial draw
ctx.clearRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
